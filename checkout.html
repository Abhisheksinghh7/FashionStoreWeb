<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Checkout</title>

  <script>
    window.adobeDataLayer = window.adobeDataLayer || [];
  </script>

  <!-- ✅ XDM PAGE LOAD (Page-level only, NO product details) -->
  <script>
    window.adobeDataLayer.push({
      event: "pageLoaded",
      xdmPageLoad: {
        custData: {
          customerID: "",
          lang: "english",
          loginStatus: "guest",
          platform: "desktop website"
        },
        web: {
          webPageDetails: {
            brand: "Fashion Store",
            channel: "web|checkout",
            pageName: "checkout",
            pageType: "checkout",
            pageUrl: window.location.href
          }
        }
      }
    });

    // ✅ CHECKOUT VIEW EVENT (scCheckout) - Push once on DOMContentLoaded
    document.addEventListener('DOMContentLoaded', function () {
      const cart = JSON.parse(localStorage.getItem("cart")) || [];
      if (cart.length > 0 && window.adl && window.adl.trackCheckout) {
        const checkoutData = {
          totalQuantity: cart.reduce((sum, item) => sum + item.qty, 0),
          totalValue: cart.reduce((sum, item) => sum + item.price * item.qty, 0),
          products: cart
        };

        window.adl.trackCheckout(checkoutData);
      }
    });
  </script>

  <!-- Adobe Launch -->
  <script src="https://assets.adobedtm.com/21b53c73144b/5951ce710caa/launch-c3f0f6fab34e-development.min.js"
    async></script>

  <link rel="stylesheet" href="style.css">

  <style>
    .payment-methods {
      display: flex;
      gap: 20px;
      margin: 20px 0;
    }

    .payment-card {
      flex: 1;
      display: flex;
      align-items: center;
      gap: 12px;
      border: 2px solid #ccc;
      border-radius: 10px;
      padding: 15px;
      cursor: pointer;
      background: #fff;
    }

    .payment-card img {
      width: 45px;
    }

    .payment-card input[type="radio"] {
      transform: scale(1.2);
      cursor: pointer;
    }
  </style>
</head>

<body>

  <header>
    <h2>Checkout</h2>
    <div class="mini-cart" onclick="goToCart()">🛒 <span id="miniCartCount">0</span></div>
  </header>

  <div class="container">
    <h3 id="checkoutTotal"></h3>

    <div class="customer-info">
      <input type="text" id="custName" placeholder="Full Name">
      <input type="text" id="custPhone" placeholder="Mobile Number">
      <input type="email" id="custEmail" placeholder="Email Address">
    </div>

    <div class="payment-methods">
      <label class="payment-card">
        <input type="radio" name="payment" value="PhonePe">
        <img src="PhonePeSVG.wine.svg">
      </label>

      <label class="payment-card">
        <input type="radio" name="payment" value="GPay">
        <img src="GooglepaySVG.wine.svg">
      </label>

      <label class="payment-card">
        <input type="radio" name="payment" value="Paytm">
        <img src="PaytmSVG.wine.svg">
      </label>
    </div>

    <div class="checkout-actions">
      <button id="placeOrderBtn">Place Order</button>
      <button type="button" id="cancelOrderBtn">Cancel Order</button>
    </div>

    <div class="modal" id="modal">
      <div class="modal-content">
        <h3 id="mTitle"></h3>
        <p id="mText"></p>
        <button id="okBtn">OK</button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
  <script src="cancel-order.js"></script>
  <script src="adl-utils.js"></script>
  <script src="adl-events.js"></script>
  <script src="adl-auto-track.js"></script>

  <script>
    // Console logging only - for verification
    document.addEventListener('DOMContentLoaded', function () {
      setTimeout(function () {
        const cart = getCart();
        if (cart.length > 0) {
          const productCatalog = {
            1: { productCategory: "fashion", productMaterial: "cotton", productRating: 4.5 },
            2: { productCategory: "fashion", productMaterial: "denim", productRating: 4.3 },
            3: { productCategory: "fashion", productMaterial: "polyester", productRating: 4.7 },
            4: { productCategory: "footwear", productMaterial: "leather", productRating: 4.4 },
            5: { productCategory: "fashion", productMaterial: "cotton", productRating: 4.2 },
            6: { productCategory: "electronics", productMaterial: "plastic", productRating: 4.8 },
            7: { productCategory: "electronics", productMaterial: "plastic", productRating: 4.6 },
            8: { productCategory: "electronics", productMaterial: "metal", productRating: 4.5 }
          };
          const logData = cart.map(item => {
            const caterpillar = productCatalog[item.id] || { productCategory: '', productMaterial: '', productRating: 0 };
            return {
              SKU: item.sku || 'SKU-' + item.id,
              name: item.name,
              priceTotal: item.price * item.qty,
              quantity: item.qty,
              _caterpillarsigns: {
                productCategory: caterpillar.productCategory,
                productMaterial: caterpillar.productMaterial,
                productRating: caterpillar.productRating
              }
            };
          });
          console.log("📦 Product List Items (Checkout Page):", logData);
          console.table(logData);
        }
      }, 500);
    });
  </script>

  <script>
    const cart = getCart();

    document.getElementById("checkoutTotal").textContent =
      "Total Amount: ₹" + cart.reduce((s, i) => s + i.price * i.qty, 0);
  </script>

</body>

</html>

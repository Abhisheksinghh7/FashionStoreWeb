<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Payment Failed</title>

  <!-- ACDL INIT -->
  <script>
    window.adobeDataLayer = window.adobeDataLayer || [];
  </script>

  <script>
    const cart = JSON.parse(localStorage.getItem("checkoutCart")) || [];
    const orderId = localStorage.getItem("checkoutTransactionId");

    /* ✅ PAGE LOAD - Web Details Only */
    window.adobeDataLayer.push({
      event: "pageLoad",
      xdm: {
        web: {
          webPageDetails: {
            pageName: "Payment Failed",
            pageType: "payment-failed"
          }
        }
      },
      custData: {
        platform: "desktop web",
        loginStatus: "guest",
        language: "en",
        customerID: ""
      },
      timestamp: new Date().toISOString()
    });

    // ✅ PAYMENT FAILURE VIEW EVENT - Comprehensive productListItems + orderID
    if (cart.length > 0) {
      window.adobeDataLayer.push({
        event: "paymentFailureView",
        xdm: {
          commerce: {
            order: {
              orderID: orderId
            },
            productListItems: cart.map((item, index) => {
              const catalogProduct = window.adl?.productCatalog?.[item.id] || {};
              const name = item.name || catalogProduct.name || '';
              const img = item.img || catalogProduct.img || '';
              const discount = item.discount !== undefined ? item.discount : (catalogProduct.discount || 0);
              const coupon = item.coupon || catalogProduct.coupon || '';
              const category = item.category || catalogProduct.category || '';
              const color = item.color || catalogProduct.color || '';
              const discountAmount = discount ? (item.price * discount / 100) : 0;
              return {
                SKU: item.sku || 'SKU-' + item.id,
                currencyCode: "INR",
                discountAmount: discountAmount,
                discountPercent: discount,
                name: name,
                priceTotal: (item.price || 0) * (item.qty || 1),
                product: "Default Product",
                productAddMethod: "cart",
                productImageUrl: img,
                quantity: item.qty || 1,
                refundAmount: 0,
                unitOfMeasureCode: "EA",
                _id: item._id || 'prod_' + item.id,
                color: color,
                coupon: coupon,
                category: category,
                size: item.size || '',
                brand: "Fashion Store"
              };
            })
          }
        },
        timestamp: new Date().toISOString()
      });
    }
  </script>

  <!-- Adobe Launch -->
  <script src="https://assets.adobedtm.com/21b53c73144b/5951ce710caa/launch-c3f0f6fab34e-development.min.js"
    async></script>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <header>
    <h2>Payment Failed</h2>
  </header>

  <div class="container thankyou-container">
    <h2>❌ Order Cancelled</h2>
    <p>Order ID: <strong id="orderId"></strong></p>

    <table>
      <thead>
        <tr>
          <th>Product</th>
          <th>ID</th>
          <th>Qty</th>
          <th>Amount</th>
          <th>Color</th>
          <th>Coupon</th>
        </tr>
      </thead>
      <tbody id="orderRows"></tbody>
    </table>

    <h3 id="grandTotal"></h3>

    <button onclick="goHome()">Home</button>
  </div>

  <script>
    document.getElementById("orderId").textContent = orderId || "N/A";

    let total = 0;
    const rows = document.getElementById("orderRows");

    cart.forEach(p => {
      const amt = p.price * p.qty;
      total += amt;

      rows.innerHTML += `
      <tr>
        <td>${p.name}</td>
        <td>${p.id}</td>
        <td>${p.qty}</td>
        <td>₹${amt}</td>
        <td>${p.color || ''}</td>
        <td>${p.coupon || ''}</td>
      </tr>
    `;
    });

    document.getElementById("grandTotal").textContent =
      "Total Amount: ₹" + total;

    function goHome() {
      localStorage.removeItem("checkoutCart");
      localStorage.removeItem("checkoutTransactionId");
      localStorage.removeItem("checkoutFailureReason");
      location.href = "index.html";
    }
  </script>

</body>

</html>

<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Payment Failed</title>

  <!-- ACDL INIT -->
  <script>
    window.adobeDataLayer = window.adobeDataLayer || [];
  </script>

  <script>
    const cart = JSON.parse(localStorage.getItem("checkoutCart")) || [];
    const orderId = localStorage.getItem("checkoutTransactionId");

    /* ✅ PAGE LOAD - Web Details Only */
    window.adobeDataLayer.push({
      event: "pageLoad",
      xdm: {
        web: {
          webPageDetails: {
            pageName: "Payment Failed",
            pageType: "payment-failed"
          }
        }
      },
      custData: {
        platform: "desktop web",
        loginStatus: "guest",
        language: "en",
        customerID: ""
      },
      timestamp: new Date().toISOString()
    });

    // ✅ PAYMENT FAILURE VIEW EVENT - Comprehensive productListItems + orderID
    if (cart.length > 0) {
      window.adobeDataLayer.push({
        event: "paymentFailureView",
        xdm: {
          commerce: {
            order: {
              orderID: orderId
            },
            productListItems: cart.map((item, index) => ({
              SKU: item.sku || "SKU-" + Math.floor(Math.random() * 10000),
              _id: "prod_" + Date.now() + "_" + index,
              currencyCode: item.currency || "INR",
              discountAmount: Math.floor(Math.random() * 50),
              name: item.name || "Sample Product",
              priceTotal: (item.price || 100) * (item.quantity || item.qty || 1),
              product: item.product || "Default Product",
              productAddMethod: item.addMethod || "payment-failed",
              productImageUrl: item.imageUrl || item.img || "",
              quantity: item.quantity || item.qty || 1,
              refundAmount: 0,
              unitOfMeasureCode: "EA"
            }))
          }
        },
        timestamp: new Date().toISOString()
      });
    }
  </script>

  <!-- Adobe Launch -->
  <script
    src="https://assets.adobedtm.com/21b53c73144b/55564aea9b41/launch-64dcc44ec863-development.min.js"
    async></script>

  <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
  <h2>Payment Failed</h2>
</header>

<div class="container thankyou-container">
  <h2>❌ Order Cancelled</h2>
  <p>Order ID: <strong id="orderId"></strong></p>

  <table>
    <thead>
      <tr>
        <th>Product</th>
        <th>ID</th>
        <th>Qty</th>
        <th>Amount</th>
        <th>Color</th>
        <th>Coupon</th>
      </tr>
    </thead>
    <tbody id="orderRows"></tbody>
  </table>

  <h3 id="grandTotal"></h3>

  <button onclick="goHome()">Home</button>
</div>

<script>
  document.getElementById("orderId").textContent = orderId || "N/A";

  let total = 0;
  const rows = document.getElementById("orderRows");

  cart.forEach(p => {
    const amt = p.price * p.qty;
    total += amt;

    rows.innerHTML += `
      <tr>
        <td>${p.name}</td>
        <td>${p.id}</td>
        <td>${p.qty}</td>
        <td>₹${amt}</td>
        <td>${p.color || ''}</td>
        <td>${p.coupon || ''}</td>
      </tr>
    `;
  });

  document.getElementById("grandTotal").textContent =
    "Total Amount: ₹" + total;

  function goHome() {
    localStorage.removeItem("checkoutCart");
    localStorage.removeItem("checkoutTransactionId");
    localStorage.removeItem("checkoutFailureReason");
    location.href = "index.html";
  }
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Thank You</title>

  <!-- ✅ LOAD ADL UTILITIES FIRST -->
  <script src="adl-utils.js"></script>
  <script src="adl-events.js"></script>

  <script>
    window.adobeDataLayer = window.adobeDataLayer || [];
  </script>

  <!-- ✅ ADOBE LAUNCH LIBRARY (Must load before purchase event) -->
  <script src="https://assets.adobedtm.com/21b53c73144b/5951ce710caa/launch-c3f0f6fab34e-development.min.js"></script>

  <!-- ✅ XDM PAGE LOAD -->
  <script>
    window.adobeDataLayer.push({
      event: "pageLoaded",
      xdmPageLoad: {
        custData: {
          customerID: "",
          lang: "english",
          loginStatus: "guest",
          platform: "desktop website"
        },
        web: {
          webPageDetails: {
            brand: "Fashion Store",
            channel: "web|confirmation",
            pageName: "confirmation",
            pageType: "confirmation",
            pageUrl: window.location.href
          }
        }
      }
    });
  </script>

  <!-- ✅ PURCHASE EVENT - Wait for Adobe Launch to be ready -->
  <script>
    function firePurchaseEvent() {
      const cart = JSON.parse(localStorage.getItem("checkoutCart")) || [];
      const orderId = localStorage.getItem("checkoutTransactionId") || "ORD-" + Date.now();
      const orderEmail = localStorage.getItem("checkoutCustomerEmail") || "";
      const customerName = localStorage.getItem("checkoutCustomerName") || "";

      if (cart.length > 0 && window.adl && window.adl.trackPurchase) {

        // 🔧 FIXED productListItems structure
        const productListItems = cart.map(item => {
          const catalog = {
            1: { productCategory: "fashion", productMaterial: "cotton", productRating: 5 },
            2: { productCategory: "fashion", productMaterial: "denim", productRating: 4 },
            3: { productCategory: "fashion", productMaterial: "polyester", productRating: 4 },
            4: { productCategory: "footwear", productMaterial: "leather", productRating: 4 },
            5: { productCategory: "fashion", productMaterial: "cotton", productRating: 4 },
            6: { productCategory: "electronics", productMaterial: "plastic", productRating: 5 },
            7: { productCategory: "electronics", productMaterial: "plastic", productRating: 4 },
            8: { productCategory: "electronics", productMaterial: "metal", productRating: 5 }
          };

          const meta = catalog[item.id] || {};

          const listItem = {
            SKU: item.sku || "SKU-" + item.id,
            name: item.name,
            quantity: item.qty,
            priceTotal: item.price * item.qty
          };

          // ✅ ADD CUSTOM ATTRIBUTES IN XDM NAMESPACE
          if (meta.productCategory || meta.productMaterial || meta.productRating) {
            listItem._digiwebanaoptznapactrsd = {
              caterpillarsigns: {
                productCategory: String(meta.productCategory || ""),
                productMaterial: String(meta.productMaterial || ""),
                productRating: Number(meta.productRating) || 0
              }
            };
          }

          return listItem;
        });

        console.log("📦 Firing purchase event with productListItems:", productListItems);

        window.adl.trackPurchase({
          orderID: orderId,
          totalQuantity: cart.reduce((s, i) => s + i.qty, 0),
          totalValue: cart.reduce((s, i) => s + i.price * i.qty, 0),
          customerEmail: orderEmail,
          firstName: customerName,
          productListItems: productListItems
        });
      } else {
        console.warn("❌ Cannot fire purchase event. Cart empty or ADL not ready:", {
          cartLength: cart?.length,
          adlExists: !!window.adl,
          trackPurchaseExists: !!window.adl?.trackPurchase
        });
      }
    }

    // ✅ WAIT FOR ADOBE LAUNCH TO LOAD, THEN FIRE PURCHASE EVENT
    document.addEventListener('DOMContentLoaded', function () {
      // Try immediately first
      if (window.adl && window.adl.trackPurchase) {
        firePurchaseEvent();
      } else {
        // If not ready, wait and retry
        let attempts = 0;
        const checkInterval = setInterval(() => {
          attempts++;
          console.log(`🔍 Waiting for Adobe Launch (attempt ${attempts})...`);

          if (window.adl && window.adl.trackPurchase) {
            clearInterval(checkInterval);
            console.log("✅ Adobe Launch ready! Firing purchase event...");
            firePurchaseEvent();
          } else if (attempts > 50) {
            clearInterval(checkInterval);
            console.error("❌ Adobe Launch did not load after 5 seconds");
          }
        }, 100);
      }
    });
  </script>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <header>
    <h2>Order Confirmed</h2>
  </header>

  <div class="container thankyou-container">
    <h2>🎉 Thank You for Your Order</h2>
    <p>Order ID: <strong id="orderId"></strong></p>

    <table width="100%" border="1">
      <thead>
        <tr>
          <th>Product</th>
          <th>ID</th>
          <th>Qty</th>
          <th>Amount</th>
        </tr>
      </thead>
      <tbody id="orderRows"></tbody>
    </table>

    <h3 id="grandTotal"></h3>
    <button onclick="finishOrder()">Go to Home</button>
  </div>

  <script>
    const cart = JSON.parse(localStorage.getItem("checkoutCart")) || [];
    const orderId = localStorage.getItem("checkoutTransactionId");
    let total = 0;

    document.getElementById("orderId").textContent = orderId || "N/A";

    cart.forEach(p => {
      const amt = p.price * p.qty;
      total += amt;

      orderRows.innerHTML += `
        <tr>
          <td>${p.name}</td>
          <td>${p.id}</td>
          <td>${p.qty}</td>
          <td>₹${amt}</td>
        </tr>
      `;
    });

    grandTotal.textContent = "Total Paid: ₹" + total;

    function finishOrder() {
      localStorage.clear();
      location.href = "index.html";
    }
  </script>

</body>

</html>

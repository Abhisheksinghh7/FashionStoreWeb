<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Thank You</title>

  <!-- ===============================
       ADL UTILITIES (UNCHANGED)
       =============================== -->
  <script src="adl-utils.js"></script>
  <script src="adl-events.js"></script>

  <!-- ===============================
       ADOBE DATA LAYER INIT
       =============================== -->
  <script>
    window.adobeDataLayer = window.adobeDataLayer || [];
  </script>

  <!-- ===============================
       ADOBE LAUNCH (UNCHANGED)
       =============================== -->
  <script src="https://assets.adobedtm.com/21b53c73144b/5951ce710caa/launch-c3f0f6fab34e-development.min.js"></script>

  <!-- ===============================
       PAGE LOAD EVENT (UNCHANGED)
       =============================== -->
  <script>
    window.adobeDataLayer.push({
      event: "pageLoaded",
      xdmPageLoad: {
        custData: {
          customerID: "",
          lang: "english",
          loginStatus: "guest",
          platform: "desktop website"
        },
        web: {
          webPageDetails: {
            brand: "Fashion Store",
            channel: "web|confirmation",
            pageName: "confirmation",
            pageType: "confirmation",
            pageUrl: window.location.href
          }
        }
      }
    });
  </script>

  <!-- ===============================
       PURCHASE EVENT (FIXED)
       =============================== -->
  <script>
    function firePurchaseEvent() {

      const cart = JSON.parse(localStorage.getItem("checkoutCart")) || [];
      const orderId = localStorage.getItem("checkoutTransactionId") || ("ORD-" + Date.now());
      const orderEmail = localStorage.getItem("checkoutCustomerEmail") || "";
      const customerName = localStorage.getItem("checkoutCustomerName") || "";

      if (!cart.length) {
        console.warn("❌ Purchase not fired: cart is empty");
        return;
      }

      if (!window.adl || !window.adl.trackPurchase) {
        console.warn("❌ Purchase not fired: ADL not ready");
        return;
      }

      /* =====================================================
         ✅ CRITICAL FIX
         Pull enriched productListItems from Adobe Launch
         (Includes caterpillarsigns correctly)
         ===================================================== */
      const productListItems =
        _satellite.getVar("Custom Code productListItems") || [];

      console.log("✅ Final productListItems from Launch:", productListItems);

      window.adl.trackPurchase({
        orderID: orderId,
        totalQuantity: cart.reduce((s, i) => s + (i.qty || 1), 0),
        totalValue: cart.reduce((s, i) => s + (i.price * i.qty), 0),
        customerEmail: orderEmail,
        firstName: customerName,
        productListItems: productListItems
      });
    }

    /* =====================================================
       WAIT FOR ADOBE LAUNCH TO BE READY
       ===================================================== */
    document.addEventListener("DOMContentLoaded", function () {

      if (window.adl && window.adl.trackPurchase) {
        firePurchaseEvent();
        return;
      }

      let attempts = 0;
      const interval = setInterval(function () {
        attempts++;

        if (window.adl && window.adl.trackPurchase) {
          clearInterval(interval);
          firePurchaseEvent();
        }

        if (attempts > 50) {
          clearInterval(interval);
          console.error("❌ Adobe Launch did not load in time");
        }
      }, 100);
    });
  </script>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <header>
    <h2>Order Confirmed</h2>
  </header>

  <div class="container thankyou-container">
    <h2>🎉 Thank You for Your Order</h2>
    <p>Order ID: <strong id="orderId"></strong></p>

    <table width="100%" border="1">
      <thead>
        <tr>
          <th>Product</th>
          <th>ID</th>
          <th>Qty</th>
          <th>Amount</th>
        </tr>
      </thead>
      <tbody id="orderRows"></tbody>
    </table>

    <h3 id="grandTotal"></h3>
    <button onclick="finishOrder()">Go to Home</button>
  </div>

  <!-- ===============================
       UI RENDER (UNCHANGED)
       =============================== -->
  <script>
    const cart = JSON.parse(localStorage.getItem("checkoutCart")) || [];
    const orderId = localStorage.getItem("checkoutTransactionId");
    let total = 0;

    document.getElementById("orderId").textContent = orderId || "N/A";

    cart.forEach(p => {
      const amt = p.price * p.qty;
      total += amt;

      document.getElementById("orderRows").innerHTML += `
        <tr>
          <td>${p.name}</td>
          <td>${p.id}</td>
          <td>${p.qty}</td>
          <td>₹${amt}</td>
        </tr>
      `;
    });

    document.getElementById("grandTotal").textContent =
      "Total Paid: ₹" + total;

    function finishOrder() {
      localStorage.clear();
      location.href = "index.html";
    }
  </script>

</body>
</html>
